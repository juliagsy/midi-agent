[project]
name = "midi-agent"
version = "0.1.0"
description = "Tool-augmented MIDI editing agents for general-purpose LLMs (Paper 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "musicinstruct",
    "pydantic>=2.7",
]

[tool.uv.sources]
musicinstruct = { path = "../musicinstruct", editable = true }

[project.optional-dependencies]
llm = ["transformers>=4.44", "torch", "accelerate", "huggingface_hub"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
midi-agent = "midi_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midi_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
